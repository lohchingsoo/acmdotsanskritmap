:root{
  --wall:#DCE3DA;--label:#FBFBF8;--ink:#1F2D2A;--muted:#4F5D57;--rule:#C3CDC4;
  --gilt:#7F6226;--aubergine:#6A4A6E;--btn-ink:#FBFBF8;--tint:#EDF1EB;--dotc:#97A69B;
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --wall:#121A18;--label:#1B2522;--ink:#E4EBE6;--muted:#9AA8A1;--rule:#2E3B37;
    --gilt:#CDAA5F;--aubergine:#C9A3CD;--btn-ink:#121A18;--tint:#212D29;--dotc:#5E7069;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --wall:#121A18;--label:#1B2522;--ink:#E4EBE6;--muted:#9AA8A1;--rule:#2E3B37;
  --gilt:#CDAA5F;--aubergine:#C9A3CD;--btn-ink:#121A18;--tint:#212D29;--dotc:#5E7069;color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background:var(--wall);color:var(--ink);
  font-family:"Spectral","Noto Serif SC",Georgia,"Times New Roman",serif;font-size:18px;line-height:1.55;
  -webkit-font-smoothing:antialiased;display:flex;flex-direction:column;align-items:center}
.deva{font-family:"Tiro Devanagari Sanskrit","Noto Serif Devanagari","Kohinoor Devanagari",serif}
.cjk{font-family:"Noto Serif SC","Songti SC","STSong","SimSun",serif}
.frame{width:100%;max-width:540px;padding:24px 20px 36px;display:flex;flex-direction:column;flex:1}
.masthead{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px;min-height:40px}
.logo{display:block;height:40px;width:40px;border-radius:1px}
.unit{font-size:14px;color:var(--muted);text-align:right}
.label{background:var(--label);padding:36px 30px 30px;position:relative;box-shadow:0 1px 0 var(--rule),0 18px 40px -28px rgba(20,30,28,.45)}
.label::before{content:"";position:absolute;left:30px;right:30px;top:16px;height:1px;background:var(--gilt);opacity:.7}
.intro-deva{font-size:30px;color:var(--gilt);margin:0 0 18px;line-height:1.3}
h1{font-weight:300;font-size:44px;line-height:1.05;letter-spacing:-.01em;margin:6px 0 14px}
p{margin:0 0 14px}
.small{font-size:15px;color:var(--muted)}
.progress{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);margin-bottom:10px}
.bar{height:2px;background:var(--rule);margin-bottom:18px}
.bar span{display:block;height:100%;background:var(--gilt);transition:width .4s ease}

.map{display:block;width:100%;height:auto;max-height:46vh;margin:0 auto 16px;overflow:visible}
.intro-map{margin-top:22px}
.map.map-intro{max-height:40vh;margin-bottom:0}
.map .tint{fill:var(--tint)}
.map .dot{fill:var(--dotc)}
.plabel{font-family:"Spectral","Noto Serif SC",Georgia,serif;font-size:46px;fill:var(--ink);paint-order:stroke;stroke:var(--label);stroke-width:10px;stroke-linejoin:round}
.pin{fill:var(--label);stroke:var(--muted);stroke-width:4}
.pin.sk{fill:var(--gilt);stroke:var(--gilt)}
.pin.no{fill:var(--label);stroke:var(--aubergine);stroke-width:5}
.pin.cur{fill:var(--ink);stroke:var(--label);stroke-width:6}
.halo{fill:none;stroke:var(--ink);stroke-width:5;transform-box:fill-box;transform-origin:center;animation:pulse 1.8s ease-out infinite}
@keyframes pulse{from{opacity:.9;transform:scale(1)}to{opacity:0;transform:scale(2.6)}}
.legend{display:flex;gap:18px;justify-content:center;font-size:14px;color:var(--muted);margin:-8px 0 6px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.legend .k1{background:var(--gilt)}
.legend .k2{border:2px solid var(--aubergine)}

.tag{font-size:14px;color:var(--gilt);letter-spacing:.04em;margin-bottom:2px}
.word{font-weight:300;font-size:52px;line-height:1.08;letter-spacing:-.015em;margin:4px 0 6px;overflow-wrap:anywhere}
.word.cjk{letter-spacing:.04em}
.pinyin{font-size:24px;font-style:italic;margin:-2px 0 18px}
.spacer{height:16px}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px}
button,.btn{font:inherit;font-size:17px;cursor:pointer;border-radius:2px;padding:14px 12px;
  border:1px solid var(--ink);background:transparent;color:var(--ink);transition:background .15s ease,color .15s ease;-webkit-tap-highlight-color:transparent}
.btn{display:block;text-align:center;text-decoration:none}
button.primary,.btn.primary{background:var(--ink);color:var(--btn-ink)}
@media (hover:hover){
  button:hover{background:var(--ink);color:var(--btn-ink)}
  button.primary:hover,.btn.primary:hover{background:transparent;color:var(--ink)}
  .choices button[disabled]:hover{background:transparent;color:var(--ink)}
}
button:focus-visible,.btn:focus-visible{outline:2px solid var(--gilt);outline-offset:3px}
button[disabled]{cursor:default}
.choices button[disabled]:not(.picked){opacity:.35}
.choices button.picked,.choices button.picked:hover{background:var(--ink);color:var(--btn-ink)}
.provenance{border-top:1px solid var(--rule);margin-top:26px;padding-top:20px;animation:settle .5s ease both}
@keyframes settle{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.verdict{font-size:15px;margin-bottom:10px}
.verdict.right{color:var(--gilt)}
.verdict.wrong{color:var(--aubergine)}
.script{font-size:40px;line-height:1.35;color:var(--gilt);margin:0 0 2px;text-align:left}
.script.latin{font-size:30px;font-style:italic}
.translit{font-style:italic;font-size:20px;margin-bottom:2px}
.lang{font-size:15px;color:var(--muted);margin-bottom:12px}
.note{margin:0}
.next{margin-top:22px;width:100%}
.score{font-weight:300;font-size:56px;line-height:1;margin:6px 0 10px}
.invite{border-top:1px solid var(--rule);margin-top:22px;padding-top:22px}
.invite h2{font-weight:400;font-size:26px;line-height:1.2;margin:0 0 8px}
.actions{display:grid;gap:10px;margin-top:22px}
footer{font-size:13px;color:var(--muted);margin-top:auto;padding-top:28px}
@media (max-width:420px){
  h1{font-size:36px}.word{font-size:42px}.score{font-size:48px}.script{font-size:34px}.script.latin{font-size:26px}
  .label{padding:32px 22px 24px}.label::before{left:22px;right:22px}.logo{height:36px;width:36px}
}
@media (max-height:740px){
  .frame{padding-top:14px}.masthead{margin-bottom:14px}
  .label{padding-top:28px}.label::before{top:12px}
  .map{max-height:31vh;margin-bottom:12px}

    }
  });
  return `<svg class="map${mode === "intro" ? " map-intro" : ""}" viewBox="0 0 1000 ${MAP_H}" role="img" aria-label="Map of Southeast Asia and southern China${mode === "end" ? " showing which places have Sanskrit names" : ""}">
    <defs>
      <pattern id="dots" width="13" height="13" patternUnits="userSpaceOnUse"><circle class="dot" cx="6.5" cy="6.5" r="2.7"/></pattern>
      <radialGradient id="fadeG" cx="50%" cy="50%" r="60%"><stop offset="0.68" stop-color="#fff"/><stop offset="1" stop-color="#000"/></radialGradient>
      <mask id="fade"><rect width="1000" height="${MAP_H}" fill="url(#fadeG)"/></mask>
    </defs>
    <g mask="url(#fade)"><path class="tint" d="${MAP_D}"/><path d="${MAP_D}" fill="url(#dots)"/></g>
    ${pins}${cur}</svg>`;
}

function intro(){
  stage.innerHTML = `
    <p class="intro-deva deva" lang="sa" aria-hidden="true">संस्कृतम्</p>
    <h1>Sanskrit on the Map</h1>
    <p>Sanskrit hides in place names across Southeast Asia and China.</p>
    <p>Twelve places. For each, decide: Sanskrit or not? It takes about two minutes.</p>
    <div class="actions"><button class="primary" id="go">Begin</button></div>
    <div class="intro-map">${mapSVG("intro")}</div>`;
  document.getElementById("go").onclick = () => { i = 0; score = 0; round(); };
  toTop();
}

function round(){
  const p = PLACES[i];
  const zh = p.cls_word === "cjk" || /[\u3400-\u9fff]/.test(p.w);
  stage.innerHTML = `
    <div class="progress"><span>Place ${i + 1} of ${PLACES.length}</span><span id="tally">${score} correct</span></div>
    <div class="bar"><span style="width:${(i / PLACES.length) * 100}%"></span></div>
    ${mapSVG("round")}
    <div class="tag">${esc(p.t)}</div>
    <div class="word${zh ? " cjk" : ""}" lang="${zh ? "zh-Hans" : "en"}">${esc(p.w)}</div>
    ${p.py ? `<div class="pinyin" lang="zh-Latn-pinyin">${esc(p.py)}</div>` : `<div class="spacer"></div>`}
    <div class="choices">
      <button data-a="1">Sanskrit</button>
      <button data-a="0">Not Sanskrit</button>
    </div>
    <div id="prov"></div>`;
  const readyAt = performance.now() + 350;
  stage.querySelectorAll(".choices button").forEach(b => b.addEventListener("click", () => {
    if (performance.now() < readyAt || b.disabled) return;
    answer(b);
  }));
  toTop();
}

function answer(btn){
  const p = PLACES[i];
  const right = (btn.dataset.a === "1") === p.s;
  if (right) score++;
  stage.querySelectorAll(".choices button").forEach(b => b.disabled = true);
  btn.classList.add("picked");
  document.getElementById("tally").textContent = `${score} correct`;
  const sl = LANG[p.cls] ? ` lang="${LANG[p.cls]}"` : "";
  const prov = document.getElementById("prov");
  prov.className = "provenance";
  prov.innerHTML = `
    <div class="verdict ${right ? "right" : "wrong"}">${right ? "Correct." : "Not quite."} ${p.s ? (p.vs || "It is Sanskrit.") : "It is not Sanskrit."}</div>
    <div class="script ${p.cls || "latin"}"${sl}>${esc(p.script)}</div>
    ${p.tr ? `<div class="translit">${esc(p.tr)}</div>` : ""}
    <div class="lang">${esc(p.lang)}</div>
    <p class="note">${esc(p.note)}</p>
    <button class="primary next" id="nx">${i < PLACES.length - 1 ? "Next place" : "See your result"}</button>`;
  const nx = document.getElementById("nx");
  nx.focus({preventScroll:true});
  nx.scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block:"nearest"});
  nx.addEventListener("click", () => { i++; i < PLACES.length ? round() : finish(); }, {once:true});
}

function finish(){
  const n = PLACES.length;
  const line = score >= 11 ? "A Sanskrit scholar in the making. Come and prove it."
             : score >= 8  ? "A sharp eye. Some of these names hide better than others."
             : "Sanskrit hides well in place names. That is what this session is about.";
  stage.innerHTML = `
    <div class="small">Your result</div>
    <div class="score">${score} of ${n}</div>
    <p>${line}</p>
    ${mapSVG("end")}
    <div class="legend"><span><i class="k1"></i>Sanskrit name</span><span><i class="k2"></i>Not Sanskrit</span></div>
    <div class="invite">
      <h2>Let’s Learn Sanskrit with Abha Kaul</h2>
      <p>Wednesday 2 December 2026, 10am to 11.30am<br>Asian Civilisations Museum</p>
      <p>Learn the meanings of artefact names at the ACM, from bodhisattva to yakshi, and write your own name in Devanagari.</p>
    </div>
    <div class="actions">
      <a class="btn primary" href="https://forms.gle/4hqcbnC5Gc1BLJZG7" target="_blank" rel="noopener">Register here</a>
      <button id="again">Play again</button>
    </div>`;
  document.getElementById("again").onclick = intro;
  toTop();
}

intro();
</script>
</body>
</html>
